<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Game Engine</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 100%;
        height: 100vh;
        overflow: hidden;
        font-family: "Arial", sans-serif;
        background: #000;
      }

      #canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #ui {
        position: absolute;
        top: 10px;
        left: 10px;
        color: #fff;
        font-size: 14px;
        background: rgba(0, 0, 0, 0.7);
        padding: 10px;
        border-radius: 5px;
        z-index: 10;
      }

      #fps {
        display: inline-block;
        margin-right: 20px;
      }

      #debug {
        font-size: 12px;
        margin-top: 10px;
        color: #0f0;
      }
    </style>
  </head>
  <body>
    <div id="ui">
      <div id="fps">FPS: 0</div>
      <div id="debug"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
